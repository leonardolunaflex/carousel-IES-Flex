<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IES Accordion Carousel</title>

  <style>
    /* Fuente personalizada */
    @font-face {
      font-family: 'AvantGardeBold';
      src: url('fonts/ITC-Avant-Garde-Gothic-Pro-Bold.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    /* Contenedor principal */
    .ies-carousel-container {
      display: flex;
      flex-direction: column;
      /* 🔹 CAMBIO CLAVE */
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Animaciones de entrada */
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Título arriba */
    .ies-title-section {
      width: 120%;
      text-align: center;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .ies-title-section h2 {
      font-family: 'AvantGardeBold', 'Segoe UI', Tahoma, sans-serif;
      /* Estilo elegante, llamativo y formal inspirado en la marca */
      background: linear-gradient(135deg, #005486 0%, #009ADD 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #005486;
      /* Fallback */

      /* Responsividad en una sola línea */
      white-space: nowrap;
      font-size: clamp(10px, 3vw, 2.5rem);
      line-height: 1.3;
      margin: 0;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Carrusel ahora usa todo el ancho */
    .ies-accordion {
      display: flex;
      width: 100%;
      height: 450px;
      gap: 15px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    }

    .ies-panel {
      position: relative;
      flex: 1;
      border-radius: 20px;
      transition: flex 0.7s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      overflow: hidden;
      background-color: #ededed;
    }

    /* Fondo separado para permitir animación de zoom sin distorsión */
    .ies-panel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 0;
    }

    .ies-panel:hover .ies-panel-bg,
    .ies-panel.active .ies-panel-bg {
      transform: scale(1.08); /* Zoom sutil para hacer más visible la imagen */
    }

    /* Leve disminución de iluminación cuando no es on-hover */
    .ies-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.12);
      transition: background-color 0.5s ease;
      z-index: 1;
      pointer-events: none;
    }

    /* Efecto de iluminación reluciente (reflejo) oculto inicialmente */
    .ies-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
      transform: skewX(-25deg);
      z-index: 4;
      pointer-events: none;
    }

    .ies-panel:hover,
    .ies-panel.active {
      flex: 3;
      box-shadow: 0 15px 35px rgba(0, 84, 134, 0.25);
      transform: translateY(-5px);
      z-index: 5;
    }

    /* Restaurar iluminación e iniciar brillo reluciente al hacer hover */
    .ies-panel:hover::after,
    .ies-panel.active::after {
      background-color: rgba(0, 0, 0, 0);
    }

    .ies-panel:hover::before,
    .ies-panel.active::before {
      animation: shine 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes shine {
      100% {
        left: 200%;
      }
    }

    .ies-panel-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0) 45%);
      z-index: 2;
    }

    .ies-label {
      position: absolute;
      bottom: -40px;
      left: 20px;
      background-color: #009ADD;
      color: #ffffff;
      padding: 10px 22px;
      font-size: 1.1rem;
      font-family: 'AvantGardeBold', 'Segoe UI', Tahoma, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 8px;
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0;
      z-index: 3;
      box-shadow: 0 4px 15px rgba(0, 154, 221, 0.4);
    }

    .ies-panel:hover .ies-label,
    .ies-panel.active .ies-label {
      bottom: 25px;
      opacity: 1;
    }


    /* Responsive */
    @media (max-width: 900px) {
      .ies-accordion {
        height: 380px;
      }
    }

    @media (max-width: 600px) {
      .ies-accordion {
        flex-direction: column;
        height: 600px;
      }
    }
  </style>
</head>

<body>

  <div class="ies-carousel-container">

    <!-- Título -->
    <div class="ies-title-section">
      <h2>Enterprise Integration Services - Operations Team</h2>
    </div>

    <!-- Carrusel -->
    <div class="ies-accordion">

      <div class="ies-panel">
        <div class="ies-panel-bg" style="background-image:url('./images/cover_webMethods.png');"></div>
        <div class="ies-panel-overlay"></div>
        <!--<div class="ies-label">webMethods</div>-->
      </div>

      <div class="ies-panel">
        <div class="ies-panel-bg" style="background-image:url('./images/cover_rvs.png');"></div>
        <div class="ies-panel-overlay"></div>
        <!--<div class="ies-label">RVS
      </div>-->
      </div>

      <div class="ies-panel">
        <div class="ies-panel-bg" style="background-image:url('./images/cover_axon.png');"></div>
        <div class="ies-panel-overlay"></div>
        <!--<div class="ies-label">AXON</div>-->
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const panels = document.querySelectorAll('.ies-panel');

      panels.forEach(panel => {
        panel.addEventListener('mouseenter', () => {
          panels.forEach(p => p.classList.remove('active'));
          panel.classList.add('active');
        });
      });
    });
  </script>

</body>

</html>
