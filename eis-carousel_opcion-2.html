<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opción 3 - EIS</title>

  <style>
    /* Fuente personalizada */
    @font-face {
      font-family: 'AvantGardeBold';
      src: url('fonts/ITC-Avant-Garde-Gothic-Pro-Bold.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    /* Contenedor principal */
    .ies-carousel-container {
      display: flex;
      flex-direction: column;
      /* 🔹 CAMBIO CLAVE */
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Animaciones de entrada */
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Banner principal de ancho completo */
    .ies-main-banner {
      width: 100%;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .ies-main-banner img {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 10px 25px rgba(0, 84, 134, 0.15);
    }

    /* Carrusel ahora usa todo el ancho */
    .ies-accordion {
      display: flex;
      width: 100%;
      height: 400px;
      gap: 15px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    }

    .ies-panel {
      position: relative;
      flex: 1;
      border-radius: 20px;
      background-size: cover;
      background-position: center;
      transition: flex 0.7s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      overflow: hidden;
      background-color: #ededed;
    }

    .ies-panel:hover,
    .ies-panel.active {
      flex: 1.2;
      box-shadow: 0 15px 35px rgba(0, 84, 134, 0.25);
      transform: translateY(-5px);
      z-index: 5;
    }

    /* Restaurar iluminación e iniciar brillo reluciente al hacer hover */
    .ies-panel:hover::after,
    .ies-panel.active::after {
      background-color: rgba(0, 0, 0, 0);
    }

    .ies-panel:hover::before,
    .ies-panel.active::before {
      animation: shine 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Barra indicadora brillante en la parte inferior */
    .ies-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 6px;
      background: linear-gradient(90deg, #009ADD, #00eaee);
      box-shadow: 0 0 15px #00eaee;
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 3;
    }

    .ies-panel.active .ies-indicator {
      width: 100%;
      transition-delay: 0.3s;
    }

    @keyframes shine {
      100% {
        left: 200%;
      }
    }

    .ies-label {
      position: absolute;
      bottom: 30px;
      left: 0;
      background-color: #005486;
      color: #ffffff;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: all 0.4s ease;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .ies-panel:hover .ies-label,
    .ies-panel.active .ies-label {
      background-color: #009ADD;
    }


    /* Responsive */
    @media (max-width: 900px) {
      .ies-accordion {
        height: 380px;
      }
    }

    @media (max-width: 600px) {
      .ies-accordion {
        flex-direction: column;
        height: 600px;
      }
    }
  </style>
</head>

<body style="margin: 0; padding: 0;">
  <div class="ies-main-banner">
    <img src="./images/banners/banner_4.png" alt="Enterprise Integration Services - Operations Team">
  </div>

  <div class="ies-carousel-container">

    <!-- Carrusel -->
    <div class="ies-accordion">

      <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_x_webmethods.png');">
        <div class="ies-panel-overlay"></div>
        <div class="ies-label">webMethods</div>
        <!-- <div class="ies-indicator"></div> -->
      </div>

      <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_x_rvs.png');">
        <div class="ies-panel-overlay"></div>
        <div class="ies-label">RVS</div>
        <!-- <div class="ies-indicator"></div> -->
      </div>

      <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_x_axon.png');">
        <div class="ies-panel-overlay"></div>
        <div class="ies-label">AXON</div>
        <!-- <div class="ies-indicator"></div> -->
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const panels = document.querySelectorAll('.ies-panel');

      panels.forEach(panel => {
        panel.addEventListener('mouseenter', () => {
          panels.forEach(p => p.classList.remove('active'));
          panel.classList.add('active');
        });
      });
    });
  </script>

</body>

</html>
