<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharepoint</title>

    <style>
        /* Fuente personalizada */
        @font-face {
            font-family: 'AvantGardeBold';
            src: url('fonts/ITC-Avant-Garde-Gothic-Pro-Bold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Banner principal de ancho completo */
        .ies-main-banner {
            width: 100%;
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .ies-main-banner img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 84, 134, 0.15);
        }

        /* Contenedor principal */
        .ies-carousel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Carrusel ahora usa todo el ancho */
        .ies-accordion {
            display: flex;
            width: 100%;
            height: 400px;
            gap: 5px;
            overflow: hidden;
        }

        .ies-panel {
            position: relative;
            flex: 1;
            border-radius: 20px;
            transition: flex 1.0s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            overflow: hidden;
            background-color: #ededed;
        }

        .ies-panel-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }

        .ies-panel:hover {
            flex: 1.2;
        }

        .ies-panel:hover .ies-panel-bg {
            transform: scale(1.1);
        }

        .ies-panel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0) 10%);
            z-index: 2;
            pointer-events: none;
        }



        /* Responsive */
        @media (max-width: 900px) {
            .ies-accordion {
                height: 380px;
            }
        }

        @media (max-width: 600px) {
            .ies-accordion {
                flex-direction: column;
                height: 600px;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0;">



    <div class="ies-carousel-container">

        <!-- Carrusel -->
        <div class="ies-accordion">

            <a href="https://flextronics365.sharepoint.com/sites/eisoperations/SitePages/webMethods.aspx"
                class="ies-panel">
                <div class="ies-panel-bg"
                    style="background-image:url('./images/carousel/home_cover_x_webmethods.png');">
                </div>
                <div class="ies-panel-overlay"></div>
            </a>

            <a href="https://flextronics365.sharepoint.com/sites/eisoperations/SitePages/RVS.aspx" class="ies-panel">
                <div class="ies-panel-bg" style="background-image:url('./images/carousel/home_cover_x_rvs.png');">
                </div>
                <div class="ies-panel-overlay"></div>
            </a>

            <a href="https://flextronics365.sharepoint.com/sites/eisoperations/SitePages/Axon.aspx" class="ies-panel">
                <div class="ies-panel-bg" style="background-image:url('./images/carousel/home_cover_x_axon.png');">
                </div>
                <div class="ies-panel-overlay"></div>
            </a>

        </div>
    </div>


</body>

</html>
