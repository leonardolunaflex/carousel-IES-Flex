<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estilos de Iconos - Flex IES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F2F2F2;
        }

        .page-title {
            text-align: center;
            padding: 40px 20px 20px;
            font-size: 2.5rem;
            color: #005486;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 3px solid #009ADD;
            max-width: 1200px;
            margin: 0 auto 40px;
            font-weight: 700;
        }

        .version-title {
            text-align: center;
            font-size: 1.8rem;
            color: #262626;
            margin: 60px 0 20px;
            padding: 10px;
            font-weight: 700;
        }

        .eis-links-section {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .eis-links-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* ========================================================
           1. ESTILO PROFESIONAL (Corporativo Flex)
           ======================================================== */
        .v1-profesional {
            background-color: #FFFFFF;
            border-top: 5px solid #005486;
        }
        .v1-profesional .eis-links-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        .v1-profesional .eis-category-title { font-size: 1.4rem; color: #005486; border-bottom: 2px solid #009ADD; padding-bottom: 8px; margin-bottom: 20px; font-weight: 700; display: flex; align-items: center; }
        .v1-profesional .eis-category-title i { color: #009ADD; margin-right: 12px; }
        .v1-profesional .eis-link-card {
            display: flex; align-items: center; background: #F2F2F2; border: 1px solid #e0e0e0; border-left: 4px solid #005486; padding: 16px 20px; text-decoration: none; color: #262626; transition: all 0.3s ease; border-radius: 4px;
        }
        .v1-profesional .eis-link-card:hover { border-left-color: #009ADD; background: #FFFFFF; box-shadow: 0 5px 15px rgba(0, 84, 134, 0.1); transform: translateY(-2px); }
        .v1-profesional .eis-link-icon { font-size: 1.6rem; color: #005486; margin-right: 15px; transition: transform 0.3s ease; }
        .v1-profesional .eis-link-card:hover .eis-link-icon { color: #009ADD; transform: scale(1.1); }
        .v1-profesional .eis-link-text { font-weight: 600; font-size: 1.05rem; }

        /* ========================================================
           2. ESTILO ELEGANTE (Minimalista)
           ======================================================== */
        .v2-elegante {
            background-color: #FFFFFF;
            box-shadow: none; border: 1px solid #e0e0e0;
        }
        .v2-elegante .eis-links-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .v2-elegante .eis-category-title { font-size: 1.2rem; color: #262626; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 25px; font-weight: 400; text-align: center; }
        .v2-elegante .eis-category-title i { display: none; }
        .v2-elegante .eis-link-card {
            display: flex; align-items: center; background: transparent; padding: 15px 5px; text-decoration: none; color: #262626; transition: all 0.4s ease; border-bottom: 1px solid #F2F2F2;
        }
        .v2-elegante .eis-link-card:hover { border-bottom: 1px solid #005486; padding-left: 10px; }
        .v2-elegante .eis-link-icon { font-size: 1.3rem; color: #005486; margin-right: 20px; opacity: 0.8; }
        .v2-elegante .eis-link-card:hover .eis-link-icon { opacity: 1; }
        .v2-elegante .eis-link-text { font-weight: 400; font-size: 1.1rem; }

        /* ========================================================
           3. ESTILO FUTURISTA (High-Tech, Neón)
           ======================================================== */
        .v3-futurista {
            background-color: #262626;
            color: #FFFFFF;
            border: 1px solid #444;
            box-shadow: 0 0 20px rgba(0, 154, 221, 0.1);
        }
        .v3-futurista .eis-links-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .v3-futurista .eis-category-title { font-size: 1.5rem; color: #FFFFFF; text-shadow: 0 0 10px rgba(0, 154, 221, 0.5); border-bottom: 1px solid #009ADD; padding-bottom: 10px; margin-bottom: 25px; font-weight: 600; display: flex; align-items: center; }
        .v3-futurista .eis-category-title i { color: #009ADD; margin-right: 15px; }
        .v3-futurista .eis-link-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center; background: #333333; border: 1px solid #444; padding: 25px 20px; text-decoration: none; color: #F2F2F2; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .v3-futurista .eis-link-card::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0,154,221,0.15) 0%, transparent 70%); opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        .v3-futurista .eis-link-card:hover { border-color: #009ADD; box-shadow: inset 0 0 15px rgba(0, 154, 221, 0.3), 0 0 15px rgba(0, 154, 221, 0.3); transform: scale(1.05); z-index: 10;}
        .v3-futurista .eis-link-card:hover::before { opacity: 1; }
        .v3-futurista .eis-link-icon { font-size: 2.5rem; color: #009ADD; margin-bottom: 15px; filter: drop-shadow(0 0 5px rgba(0,154,221,0.5)); transition: all 0.3s; }
        .v3-futurista .eis-link-card:hover .eis-link-icon { color: #FFFFFF; filter: drop-shadow(0 0 8px rgba(0,154,221,0.8)); transform: rotate(-10deg); }
        .v3-futurista .eis-link-text { font-weight: 500; text-align: center; letter-spacing: 1px; font-size: 0.95rem; }

        /* ========================================================
           4. ESTILO CLÁSICO (Bloques Sólidos)
           ======================================================== */
        .v4-clasico {
            background-color: #F2F2F2;
            border: 1px solid #ccc;
        }
        .v4-clasico .eis-links-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .v4-clasico .eis-category-title { font-size: 1.6rem; color: #262626; background: #e0e0e0; padding: 12px 20px; display: block; margin-bottom: 20px; font-weight: 700; border-radius: 4px; border-left: 8px solid #005486;}
        .v4-clasico .eis-category-title i { margin-right: 12px; color: #005486;}
        .v4-clasico .eis-link-card {
            display: flex; align-items: center; background: #005486; border-radius: 6px; padding: 14px 20px; text-decoration: none; color: #FFFFFF; transition: background 0.2s, box-shadow 0.2s; box-shadow: 0 4px 0 #003a5c;
        }
        .v4-clasico .eis-link-card:hover { background: #009ADD; box-shadow: 0 2px 0 #005486; transform: translateY(2px); color: #FFFFFF; }
        .v4-clasico .eis-link-icon { font-size: 1.4rem; color: #FFFFFF; margin-right: 15px; }
        .v4-clasico .eis-link-text { font-weight: bold; font-size: 1rem; }

        /* ========================================================
           5. ESTILO MODERNO (Dinámico / Glassmorphism Ligero)
           ======================================================== */
        .v5-moderno {
            background: linear-gradient(135deg, #005486 0%, #009ADD 100%);
            padding: 50px;
        }
        .v5-moderno .eis-links-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        .v5-moderno .eis-category-title { font-size: 1.5rem; color: #FFFFFF; margin-bottom: 25px; font-weight: 700; display: flex; align-items: center; text-shadow: 0 2px 4px rgba(0,0,0,0.2);}
        .v5-moderno .eis-category-title i { color: #FFFFFF; margin-right: 12px; opacity: 0.8;}
        .v5-moderno .eis-link-card {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.95); border-radius: 100px; padding: 10px 10px 10px 20px; text-decoration: none; color: #005486; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
        }
        .v5-moderno .eis-link-card:hover { transform: translateY(-5px) scale(1.02); background: #FFFFFF; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .v5-moderno .eis-link-icon { font-size: 1.3rem; background: #009ADD; color: #FFFFFF; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; padding-left: 2px; transition: background 0.3s; margin-left: auto; order: 2;}
        .v5-moderno .eis-link-card:hover .eis-link-icon { background: #005486; transform: rotate(360deg); transition: transform 0.6s ease, background 0.3s;}
        .v5-moderno .eis-link-text { font-weight: 700; font-size: 1.05rem; order: 1; flex: 1; margin-right: 10px; }

        @media (max-width: 768px) {
            .eis-links-grid { grid-template-columns: 1fr; }
            .eis-links-section { padding: 20px; }
        }
    </style>
</head>
<body>

    <h1 class="page-title">Variaciones de Diseño - Flex IES Icons</h1>

    <div id="content-container"></div>

    <!-- TPL DE ENLACES PARA DUPLICAR POR JAVASCRIPT -->
    <template id="links-template">
        <!-- SECCIÓN: DEPLOYMENTS -->
        <h3 class="eis-category-title"><i class="fas fa-rocket"></i> Deployments</h3>
        <div class="eis-links-grid">
            <a href="https://flexpm-it.flextronics.com/" class="eis-link-card" target="_blank">
                <i class="fas fa-project-diagram eis-link-icon"></i><span class="eis-link-text">FlexPM</span>
            </a>
            <a href="https://eis-svn.flextronics.com/" class="eis-link-card" target="_blank">
                <i class="fas fa-code-branch eis-link-icon"></i><span class="eis-link-text">SVN</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fas fa-box-open eis-link-icon"></i><span class="eis-link-text">CS Packages</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fas fa-calendar-alt eis-link-icon"></i><span class="eis-link-text">MTP Calendar</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fas fa-file-code eis-link-icon"></i><span class="eis-link-text">Code Management Requests Requirements</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fas fa-database eis-link-icon"></i><span class="eis-link-text">Xref and Metadata automatic deployment</span>
            </a>
        </div>

        <!-- SECCIÓN: RESOURCES -->
        <h3 class="eis-category-title"><i class="fas fa-folder-open"></i> Resources</h3>
        <div class="eis-links-grid">
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fab fa-confluence eis-link-icon"></i><span class="eis-link-text">Confluence - EIS Operations</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fab fa-jenkins eis-link-icon"></i><span class="eis-link-text">Jenkins</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fas fa-server eis-link-icon"></i><span class="eis-link-text">Server List (wmro)</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fab fa-docker eis-link-icon"></i><span class="eis-link-text">Portainer</span>
            </a>
        </div>

        <!-- SECCIÓN: EIS OPs EXCLUSIVE PAGES -->
        <h3 class="eis-category-title"><i class="fas fa-star"></i> EIS Ops Exclusive Pages</h3>
        <div class="eis-links-grid">
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fas fa-book eis-link-icon"></i><span class="eis-link-text">EIS Operations Standardization Guidelines</span>
            </a>
            <a href="#" class="eis-link-card" target="_blank">
                <i class="fas fa-network-wired eis-link-icon"></i><span class="eis-link-text">webMethods Servers Footprint</span>
            </a>
        </div>
    </template>

    <script>
        const styles = [
            { id: "v1-profesional", name: "1. Estilo Profesional (Corporativo Flex)" },
            { id: "v2-elegante", name: "2. Estilo Elegante (Minimalista)" },
            { id: "v3-futurista", name: "3. Estilo Futurista (High-Tech, Neón)" },
            { id: "v4-clasico", name: "4. Estilo Clásico (Bloques Sólidos)" },
            { id: "v5-moderno", name: "5. Estilo Moderno (Dinámico y Fluido)" }
        ];

        const container = document.getElementById("content-container");
        const templateStr = document.getElementById("links-template").innerHTML;

        styles.forEach(style => {
            const heading = document.createElement("h2");
            heading.className = "version-title";
            heading.innerText = style.name;
            container.appendChild(heading);

            const section = document.createElement("div");
            section.className = "eis-links-section " + style.id;
            section.innerHTML = templateStr;
            container.appendChild(section);
        });
    </script>

</body>
</html>
