<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Original</title>

    <style>
        /* Fuente personalizada */
        @font-face {
            font-family: 'AvantGardeBold';
            src: url('fonts/ITC-Avant-Garde-Gothic-Pro-Bold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Contenedor principal */
        .ies-carousel-container {
            display: flex;
            flex-direction: column;
            /* 🔹 CAMBIO CLAVE */
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Banner principal de ancho completo */
        .ies-main-banner {
            width: 100%;
            animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .ies-main-banner img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 10px 25px rgba(0, 84, 134, 0.15);
        }

        /* Título arriba */
        .ies-title-section {
            width: 100%;
            text-align: center;
            /* 🔹 */
            margin-bottom: 30px;
            /* 🔹 separa del carrusel */
        }

        .ies-title-section h2 {
            font-family: 'AvantGardeBold', 'Segoe UI', Tahoma, sans-serif;
            color: #262626;
            font-size: 3rem;
            line-height: 1.2;
            margin: 0;
            font-weight: 800;
        }

        /* Carrusel ahora usa todo el ancho */
        .ies-accordion {
            display: flex;
            width: 100%;
            height: 450px;
            /* 🔹 MÁS ALTURA */
            gap: 15px;
            overflow: hidden;
        }

        .ies-panel {
            position: relative;
            flex: 1;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            transition: flex 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            overflow: hidden;
            background-color: #ededed;
        }

        .ies-panel:hover,
        .ies-panel.active {
            flex: 2;
        }

        .ies-panel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0) 50%);
        }

        .ies-label {
            position: absolute;
            bottom: 30px;
            left: 0;
            background-color: #005486;
            color: #ffffff;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.4s ease;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .ies-panel:hover .ies-label,
        .ies-panel.active .ies-label {
            background-color: #009ADD;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .ies-accordion {
                height: 380px;
            }

            .ies-title-section h2 {
                font-size: 2.4rem;
            }
        }

        @media (max-width: 600px) {
            .ies-accordion {
                flex-direction: column;
                height: 600px;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0;">

    <!-- Banner Full Width -->
    <div class="ies-main-banner">
        <img src="./images/banners/banner_25.png" alt="Enterprise Integration Services - Operations Team">
    </div>


    <div class="ies-carousel-container">

        <!-- Carrusel -->
        <div class="ies-accordion">

            <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_webmethods.png');">
                <div class="ies-panel-overlay"></div>
                <div class="ies-label">webMethods</div>
            </div>

            <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_rvs.png');">
                <div class="ies-panel-overlay"></div>
                <div class="ies-label">RVS</div>
            </div>

            <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_axon.png');">
                <div class="ies-panel-overlay"></div>
                <div class="ies-label">AXON</div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const panels = document.querySelectorAll('.ies-panel');

            panels.forEach(panel => {
                panel.addEventListener('mouseenter', () => {
                    panels.forEach(p => p.classList.remove('active'));
                    panel.classList.add('active');
                });
            });
        });
    </script>

</body>

</html>
