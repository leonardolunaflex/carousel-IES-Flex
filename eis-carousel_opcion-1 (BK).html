<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opción 1 - EIS</title>

  <style>
    /* Fuente personalizada */
    @font-face {
      font-family: 'AvantGardeBold';
      src: url('fonts/ITC-Avant-Garde-Gothic-Pro-Bold.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    /* Contenedor principal */
    .ies-carousel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Animaciones de entrada */
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Banner principal de ancho completo */
    .ies-main-banner {
      width: 100%;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .ies-main-banner img {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 10px 25px rgba(0, 84, 134, 0.15);
    }

    /* Carrusel ahora usa todo el ancho */
    .ies-accordion {
      display: flex;
      width: 100%;
      height: 450px;
      gap: 15px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards;
    }

    .ies-panel {
      position: relative;
      flex: 1;
      border-radius: 20px;
      background-size: cover;
      background-position: center;
      transition: flex 0.7s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease, transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      overflow: hidden;
      background-color: #ededed;
    }

    /* Leve disminución de iluminación cuando no es on-hover */
    .ies-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: rgba(50, 50, 50, 0.15);
      transition: background-color 0.5s ease;
      z-index: 1;
      pointer-events: none;
    }

    /*
    /* Efecto de iluminación reluciente (reflejo) oculto inicialmente */
    .ies-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
      transform: skewX(-25deg);
      z-index: 4;
      pointer-events: none;
    }

    .ies-panel:hover,
    .ies-panel.active {
      flex: 3;
      box-shadow: 0 15px 35px rgba(0, 84, 134, 0.25);
      transform: translateY(-5px);
      z-index: 5;
    }

    /* Restaurar iluminación e iniciar brillo reluciente al hacer hover 
    .ies-panel:hover::after,
    .ies-panel.active::after {
      background-color: rgba(0, 0, 0, 0);
    }

    .ies-panel:hover::before,
    .ies-panel.active::before {
      animation: shine 1s cubic-bezier(0.25, 1, 0.5, 1);
    }
    */

    @keyframes shine {
      100% {
        left: 200%;
      }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .ies-accordion {
        height: 380px;
      }
    }

    @media (max-width: 600px) {
      .ies-accordion {
        flex-direction: column;
        height: 600px;
      }
    }
  </style>
</head>

<body style="margin: 0; padding: 0;">

  <!-- Banner Full Width -->
  <div class="ies-main-banner">
    <img src="./images/banners/banner_39.png" alt="Enterprise Integration Services - Operations Team">
  </div>

  <div class="ies-carousel-container">

    <!-- Carrusel -->
    <div class="ies-accordion">

      <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_webmethods.png');">
      </div>

      <div class="ies-panel" st yle="background-image:url('./images/carousel/home_cover_rvs.png');">
      </div>

      <div class="ies-panel" style="background-image:url('./images/carousel/home_cover_axon.png');">
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const panels = document.querySelectorAll('.ies-panel');

      panels.forEach(panel => {
        panel.addEventListener('mouseenter', () => {
          panels.forEach(p => p.classList.remove('active'));
          panel.classList.add('active');
        });
      });
    });
  </script>

</body>

</html>
